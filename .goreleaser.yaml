version: 2
project_name: gophkeeper
force_token: github

git:
  prerelease_suffix: "-"

before:
  hooks:
    - go run ./tools/buildnumber .buildnumber {{ .Version }}

builds:
  - main: ./cmd/gophkeeper
    binary: gophkeeper-{{ trimsuffix .Version (print "-" .Prerelease) }}{{ if not .IsSnapshot }}-{{ mustReadFile ".buildnumber" }}{{ end }}-{{ .Os }}-{{ .Arch }}
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    targets: [darwin_amd64, darwin_arm64, linux_amd64, linux_arm64, windows_amd64, windows_arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.buildVersion={{ trimsuffix .Version (print "-" .Prerelease) }} -X main.buildNumber={{ mustReadFile ".buildnumber" }} -X main.buildDate={{ time "2006-01-02" }} -X main.buildCommit={{ .ShortCommit }}

snapshot:
  version_template: dev

name: gophkeeper-sandbox

x-service: &service
  restart: unless-stopped
  pull_policy: missing

x-health: &health
  interval: 5s
  retries: 20
  start_period: 60s
  start_interval: 1s

services:
  settings:
    <<: *service
    image: natsio/nats-box:0.20.0
    stop_signal: SIGKILL
    volumes:
      - ${XDG_CONFIG_HOME:-${USERPROFILE:-${HOME}}/.config}:/config
      - .:/src:ro
    pre_stop:
      - command:
          - sh
          - -c
          - >-
            for f in /config/gophkeeper/config.yaml /config/gophkeeper/config.sandbox.yaml; do
            head -n 1 "$$f" 2>/dev/null | grep -q "^# gophkeeper-sandbox:" && rm -f "$$f"; done; true
    command:
      - sh
      - -c
      - >-
        rm -f /tmp/ready; ls -A /config | grep -q . || chown "$$(stat -c %u:%g /src)" /config;
        touch /tmp/ready && exec tail -f /dev/null
    healthcheck: {<<: *health, test: [CMD, test, -f, /tmp/ready]}

  init:
    <<: *service
    image: golang:1.27.1-alpine
    restart: "no"
    working_dir: /src
    command: [go, run, ./cmd/sandbox, init]
    depends_on:
      settings: {condition: service_healthy}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      CONFIG_DIR: ${XDG_CONFIG_HOME:-${USERPROFILE:-${HOME}}/.config}
      GOWORK: "off"
    volumes:
      - sandbox:/sandbox
      - ${XDG_CONFIG_HOME:-${USERPROFILE:-${HOME}}/.config}:/config
      - .:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

  nats:
    <<: *service
    image: nats:2.15.0-alpine
    command: [-c, /etc/nats/nats.conf]
    depends_on:
      init: {condition: service_completed_successfully}
    ports:
      - 127.0.0.1:54222:4222
    volumes:
      - nats:/data
      - sandbox:/etc/nats/sandbox:ro
    configs:
      - {source: nats, target: /etc/nats/nats.conf}
    healthcheck: {<<: *health, test: [CMD, wget, -q, --spider, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]}

  nats-setup:
    <<: *service
    image: natsio/nats-box:0.20.0
    stop_signal: SIGKILL
    depends_on:
      nats: {condition: service_healthy}
    environment:
      NATS_URL: tls://nats:4222
      NATS_USER: admin
      NATS_CA: /sandbox/ca.pem
    volumes:
      - sandbox:/sandbox:ro
      - ./cmd/sandbox/stream.json:/etc/nats/stream.json:ro
    command:
      - sh
      - -c
      - >-
        rm -f /tmp/ready && export NATS_PASSWORD="$$(cat /sandbox/admin)" &&
        stream="$$(jq -r .name /etc/nats/stream.json)" &&
        { nats stream info "$$stream" >/dev/null 2>&1 || nats stream add "$$stream" --config /etc/nats/stream.json; } &&
        touch /tmp/ready && exec tail -f /dev/null
    healthcheck: {<<: *health, test: [CMD, test, -f, /tmp/ready]}

volumes:
  sandbox:
  nats:
  go-mod:
  go-build:

configs:
  nats:
    content: |
      include "sandbox/passwords.conf"
      server_name: gophkeeper-sandbox
      listen: 0.0.0.0:4222
      http: 127.0.0.1:8222
      tls {
        cert_file: /etc/nats/sandbox/cert.pem
        key_file: /etc/nats/sandbox/key.pem
        timeout: 3
      }
      jetstream {
        store_dir: /data
      }
      authorization {
        timeout: 3
        users: [
          {user: admin, password: $$ADMIN_PASSWORD}
          {user: client, password: $$CLIENT_PASSWORD, permissions: {
            publish: {allow: ["changes.>"]}
            subscribe: {allow: ["_INBOX.pub.>"]}
          }}
        ]
      }

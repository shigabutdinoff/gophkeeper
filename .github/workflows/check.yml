name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  statictest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: robinraju/release-downloader@v1
        with:
          repository: Yandex-Practicum/go-autotests
          latest: true
          fileName: statictest
          out-file-path: .tools
      - run: |
          chmod +x .tools/statictest
          ! go vet -vettool=.tools/statictest ./... 2>&1 | tee /dev/stderr | grep '"posn"' >/dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      GOPHKEEPER_TEST_DATABASE: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=cover.out ./...
      - uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml

  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then BASE=$(git merge-base "origin/$DEFAULT" HEAD); fi
          pipx run pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD
